# Render Blueprint: creates the Flask API and its Postgres database.
# Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: resume-analyzer-api
    runtime: python
    plan: free
    rootDir: server_py
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: resume-analyzer-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false          # you enter this in the dashboard
      - key: CORS_ORIGINS
        sync: false          # your Vercel URL, e.g. https://resume-analyzer-s5f4.vercel.app

databases:
  - name: resume-analyzer-db
    plan: free
